name: Release creation flow
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    uses: ./.github/workflows/_validate.yaml

  build-push:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-push.yaml
    with:
      tag: ${{ github.event.release.tag_name }}

  update-infra:
    needs: build-push
    uses: ./.github/workflows/_update-infra.yaml
    secrets: inherit
    with:
      environment: production
      tag: ${{ github.event.release.tag_name }}
